<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Muro de encargos | TalentHub</title>
<link rel="icon" href="assets/logo/logo.svg" type="image/svg+xml">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: {
    colors: { navy: '#0B1E4F', 'navy-soft': '#16296B', purple: '#7C5CFF', 'purple-dark': '#6A45F0', gold: '#E9E45C', grayxl: '#F6F7FB', graytext: '#4B5563' },
    fontFamily: { display: ['Unbounded', 'sans-serif'], body: ['Plus Jakarta Sans', 'sans-serif'] }
  } } };
</script>

<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/muro.css">
</head>
<body class="font-body text-navy th-app">

<div id="th-sidebar-overlay"></div>
<aside id="th-sidebar" class="th-sidebar"></aside>

<div class="th-main">
  <header id="th-topbar" class="th-topbar"></header>

  <main class="th-content th-content--ancho">

    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
      <div>
        <h1 class="font-display font-bold text-2xl">Muro de encargos</h1>
        <p class="text-graytext text-sm mt-1">Encuentra tu próxima oportunidad entre encargos reales publicados por negocios.</p>
      </div>
      <a href="publicar-encargo.html" id="btn-publicar-encargo" class="oculto inline-flex items-center justify-center gap-2 bg-purple text-white font-display text-sm font-semibold px-5 py-3 rounded-full hover:bg-purple-dark transition-colors duration-300 shrink-0">
        <svg width="16" height="16"><use href="assets/icons/sprite.svg#icon-plus"></use></svg> Publicar encargo
      </a>
    </div>

    <!-- Buscador y filtros -->
    <div class="th-tarjeta p-4 md:p-5 mb-6">
      <div class="relative mb-4">
        <svg width="18" height="18" class="absolute left-4 top-1/2 -translate-y-1/2 text-graytext/60"><use href="assets/icons/sprite.svg#icon-search"></use></svg>
        <input type="search" id="muro-buscador" class="th-input pl-11" placeholder="Buscar encargos por título o palabra clave">
      </div>
      <div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-3">
        <select id="filtro-categoria" class="th-select">
          <option value="">Categoría: todas</option>
        </select>
        <select id="filtro-modalidad" class="th-select">
          <option value="">Modalidad: todas</option>
          <option value="Remoto">Remoto</option>
          <option value="Presencial">Presencial</option>
        </select>
        <select id="filtro-presupuesto" class="th-select">
          <option value="">Presupuesto: todos</option>
          <option value="0-80">Hasta S/ 80</option>
          <option value="80-150">S/ 80 a S/ 150</option>
          <option value="150-9999">Más de S/ 150</option>
        </select>
        <select id="filtro-nivel" class="th-select">
          <option value="">Nivel recomendado: todos</option>
          <option value="1">Nivel 1</option>
          <option value="2">Nivel 2</option>
          <option value="3">Nivel 3</option>
        </select>
      </div>
    </div>

    <p class="text-graytext text-sm mb-4" id="muro-contador"></p>

    <div id="muro-grid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>

    <div id="muro-vacio" class="th-vacio oculto">
      <img src="assets/img/mascota-talenthub.png" class="w-20 mx-auto mb-3" alt="">
      <h3 class="font-display font-semibold text-base">No encontramos encargos con esos filtros</h3>
      <p class="text-graytext text-sm mt-1">Prueba ajustando la búsqueda o quita algunos filtros.</p>
    </div>

  </main>
</div>

<nav id="th-mobile-nav" class="th-navmovil"></nav>

<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/shell.js"></script>
<script src="js/muro.js"></script>
</body>
</html>
