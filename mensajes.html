<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mensajes | TalentHub</title>
<link rel="icon" href="assets/logo/logo.svg" type="image/svg+xml">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: {
    colors: { navy: '#0B1E4F', 'navy-soft': '#16296B', purple: '#7C5CFF', 'purple-dark': '#6A45F0', gold: '#E9E45C', grayxl: '#F6F7FB', graytext: '#4B5563' },
    fontFamily: { display: ['Unbounded', 'sans-serif'], body: ['Plus Jakarta Sans', 'sans-serif'] }
  } } };
</script>

<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/mensajes.css">
</head>
<body class="font-body text-navy th-app">

<div id="th-sidebar-overlay"></div>
<aside id="th-sidebar" class="th-sidebar"></aside>

<div class="th-main">
  <header id="th-topbar" class="th-topbar"></header>

  <main class="th-content th-content--ancho">
    <h1 class="font-display font-bold text-2xl mb-5">Mensajes</h1>

    <div class="mensajes-contenedor th-tarjeta" id="mensajes-contenedor">

      <!-- Panel: lista de conversaciones -->
      <aside class="mensajes-lista-panel">
        <div class="p-4 border-b border-[#EEF0F7]">
          <div class="relative">
            <svg width="16" height="16" class="absolute left-3.5 top-1/2 -translate-y-1/2 text-graytext/60"><use href="assets/icons/sprite.svg#icon-search"></use></svg>
            <input type="search" id="mensajes-buscador" class="th-input pl-10" placeholder="Buscar conversación">
          </div>
        </div>
        <div id="mensajes-lista" class="flex-1 overflow-y-auto"></div>
      </aside>

      <!-- Panel: hilo de conversacion -->
      <section class="mensajes-hilo-panel">
        <div id="mensajes-vacio" class="th-vacio m-auto">
          <img src="assets/img/mascota-talenthub.png" class="w-16 mx-auto mb-3" alt="">
          <p class="text-graytext text-sm">Selecciona una conversación para empezar a chatear.</p>
        </div>

        <div id="mensajes-hilo" class="oculto flex flex-col h-full">
          <header class="flex items-center gap-3 p-4 border-b border-[#EEF0F7] shrink-0">
            <button type="button" id="btn-volver-lista" class="lg:hidden text-graytext"><svg width="20" height="20"><use href="assets/icons/sprite.svg#icon-arrow-left"></use></svg></button>
            <img id="hilo-avatar" src="" alt="" class="w-10 h-10 rounded-full">
            <div class="min-w-0">
              <p id="hilo-nombre" class="font-display font-semibold text-sm truncate"></p>
              <p id="hilo-meta" class="text-graytext text-xs truncate"></p>
            </div>
          </header>

          <!-- Aviso de deposito protegido, solo si la conversacion esta ligada a un encargo -->
          <div id="hilo-deposito" class="oculto mx-4 mt-4 p-3.5 rounded-xl border flex items-start gap-3"></div>

          <div id="mensajes-cuerpo" class="flex-1 overflow-y-auto p-4 space-y-3"></div>

          <form id="form-mensaje" class="flex gap-2 p-3 border-t border-[#EEF0F7] shrink-0">
            <input type="text" id="input-mensaje" class="th-input" placeholder="Escribe un mensaje...">
            <button type="submit" class="bg-purple text-white font-display text-sm font-semibold px-5 rounded-full shrink-0 hover:bg-purple-dark transition-colors duration-300">Enviar</button>
          </form>
        </div>
      </section>

    </div>
  </main>
</div>

<nav id="th-mobile-nav" class="th-navmovil"></nav>

<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/shell.js"></script>
<script src="js/mensajes.js"></script>
</body>
</html>
