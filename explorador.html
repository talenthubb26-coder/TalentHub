<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Explorador de talentos | TalentHub</title>
<link rel="icon" href="assets/logo/logo.svg" type="image/svg+xml">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: {
    colors: { navy: '#0B1E4F', 'navy-soft': '#16296B', purple: '#7C5CFF', 'purple-dark': '#6A45F0', gold: '#E9E45C', grayxl: '#F6F7FB', graytext: '#4B5563' },
    fontFamily: { display: ['Unbounded', 'sans-serif'], body: ['Plus Jakarta Sans', 'sans-serif'] }
  } } };
</script>

<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/explorador.css">
</head>
<body class="font-body text-navy th-app">

<div id="th-sidebar-overlay"></div>
<aside id="th-sidebar" class="th-sidebar"></aside>

<div class="th-main">
  <header id="th-topbar" class="th-topbar"></header>

  <main class="th-content th-content--ancho">

    <!-- Banner tematico: cambia segun la categoria seleccionada -->
    <section id="explorador-banner" class="explorador-banner explorador-banner--todos">
      <div class="explorador-banner__patron" aria-hidden="true"></div>
      <div class="explorador-banner__contenido">
        <span class="th-etiqueta th-etiqueta--gold" id="explorador-banner-chip">Explorador</span>
        <h1 class="font-display font-bold text-2xl md:text-[2rem] mt-3 text-white" id="explorador-titulo">Explora nuevos talentos</h1>
        <p class="text-white/75 text-sm md:text-base mt-2 max-w-xl" id="explorador-subtitulo">Descubre jóvenes con habilidades, proyectos e ideas que pueden inspirarte o ayudarte.</p>
      </div>
      <svg id="explorador-banner-icono" class="explorador-banner__icono" width="86" height="86"><use href="assets/icons/sprite.svg#icon-search"></use></svg>
    </section>

    <!-- Buscador -->
    <div class="relative mt-7 mb-5">
      <svg width="18" height="18" class="absolute left-4 top-1/2 -translate-y-1/2 text-graytext/60"><use href="assets/icons/sprite.svg#icon-search"></use></svg>
      <input type="search" id="explorador-buscador" class="th-input pl-11" placeholder="Buscar por nombre, talento o palabra clave">
    </div>

    <!-- Filtros por categoria -->
    <div class="flex flex-wrap gap-2 mb-8" id="explorador-categorias"></div>

    <p class="text-graytext text-sm mb-4" id="explorador-contador"></p>

    <div id="explorador-grid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>

    <div id="explorador-vacio" class="th-vacio oculto">
      <img src="assets/img/mascota-talenthub.png" class="w-20 mx-auto mb-3" alt="">
      <h3 class="font-display font-semibold text-base">No encontramos talentos con esos filtros</h3>
      <p class="text-graytext text-sm mt-1">Prueba con otra categoría o ajusta tu búsqueda.</p>
    </div>

  </main>
</div>

<nav id="th-mobile-nav" class="th-navmovil"></nav>

<!-- Modal: contactar talento (solo cuentas de negocio) -->
<div id="modal-contactar-explorador" class="modal-overlay oculto">
  <div class="modal-caja">
    <div class="flex items-center justify-between mb-5">
      <h3 class="font-display font-bold text-lg" id="titulo-contactar-explorador">Enviar mensaje</h3>
      <button type="button" data-cerrar-modal="modal-contactar-explorador" class="text-graytext"><svg width="20" height="20"><use href="assets/icons/sprite.svg#icon-close"></use></svg></button>
    </div>
    <form id="form-contactar-explorador">
      <div class="th-campo mb-4">
        <label for="exp-mensaje">Mensaje</label>
        <textarea id="exp-mensaje" class="th-textarea" placeholder="Cuéntale a este talento en qué estás pensando..."></textarea>
      </div>
      <div class="th-campo mb-6">
        <label for="exp-proyecto">Referenciar un proyecto de su portafolio (opcional)</label>
        <select id="exp-proyecto" class="th-select">
          <option value="">No referenciar ningún proyecto</option>
        </select>
      </div>
      <button type="submit" class="w-full bg-purple text-white font-display text-sm font-semibold py-3.5 rounded-full hover:bg-purple-dark transition-colors duration-300">Enviar mensaje</button>
    </form>
  </div>
</div>

<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/shell.js"></script>
<script src="js/explorador.js"></script>
</body>
</html>
